[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prusa-image-studio"
version = "0.2.1"
description = "CMYWB image projection and native PrusaSlicer 3 projects for the Prusa XL"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.24", "Pillow>=11", "trimesh>=5.2,<6", "scipy>=1.10", "rtree>=1.2", "networkx>=3", "lxml>=5", "defusedxml>=0.7", "moderngl>=5.12,<6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/PraxisOG/prusa-image-studio"

[project.scripts]
prusa-image-studio = "prusa_image_studio.app:main"
prusa-image = "prusa_image_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prusa_image_studio = ["assets/*.3mf", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
