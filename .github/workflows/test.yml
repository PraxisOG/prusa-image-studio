name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libgl1-mesa-dri libglx-mesa0
      - run: python -m pip install -e '.[test]'
      - name: Core and real OpenGL tests
        run: xvfb-run -a python -m pytest -q
      - name: Model-first GUI smoke
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python scripts/smoke_gui.py
      - name: Real file-dialog regression
        timeout-minutes: 3
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python scripts/smoke_file_dialogs.py
      - name: Public-file audit
        run: python scripts/audit_public.py
